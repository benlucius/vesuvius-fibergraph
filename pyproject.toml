[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fibergraph"
version = "0.1.0"
description = "Conservative global assembly and evaluation of papyrus fiber instances"
authors = [{name = "Ben Lucius"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "networkx>=3.2"]

[project.optional-dependencies]
villa = ["zarr>=2.18,<3"]

[project.scripts]
fibergraph = "fibergraph.cli:main"
fibergraph-eval = "fibergraph.cli:eval_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["fibergraph"]
